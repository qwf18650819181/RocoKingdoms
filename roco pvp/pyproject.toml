[project]
name = "roco-pvp"
version = "0.1.0"
description = "洛克王国：世界 PVP 自动战斗（OpenCV + YOLO + Interception）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.9.0.80",
  "numpy>=1.26.4",
  "mss>=9.0.1",
  "pywin32>=306",
  "interception-python",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3.0"]
gui = ["eel>=0.16.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
roco-pvp = "roco_pvp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roco_pvp"]
